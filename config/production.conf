# ============================================================
# Production Environment Configuration (Senior)
# ============================================================
APP_DIR=/opt/myapp
BRANCH=main
SERVICE_NAME=myapp
REPO_URL=git@github.com:example/myapp.git

# Health Check
HEALTH_URL=http://localhost:8080/health
HEALTH_TIMEOUT=60
HEALTH_INTERVAL=5

# Deployment Strategy: rolling | blue-green | canary
DEPLOY_STRATEGY=blue-green

# Notifications (leave empty to disable)
DISCORD_WEBHOOK=https://discord.com/api/webhooks/YOUR/WEBHOOK
SLACK_WEBHOOK=https://hooks.slack.com/services/YOUR/WEBHOOK/TOKEN

# Observability
PROMETHEUS_PORT=9100

# Multi-Host Deployment (space-separated for array parsing in bash)
HOSTS=app01 app02 app03

# Secrets
VAULT_PATH=secret/data/myapp/production

# Docker (if used)
DOCKER_IMAGE=myapp
DOCKER_REGISTRY=registry.example.com

# Canary weights (if strategy=canary)
CANARY_START_WEIGHT=10
CANARY_FINAL_WEIGHT=100
CANARY_STEP=10
CANARY_INTERVAL=30
