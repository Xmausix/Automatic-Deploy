version: '3.8'

services:
  # Mock application for demonstration
  app:
    image: nginx:alpine
    container_name: myapp
    ports:
      - "8080:80"
    volumes:
      - ./assets/nginx-health.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets/health.json:/usr/share/nginx/html/health:ro
    networks:
      - deploy-net

  # Prometheus for metrics collection demo
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./assets/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - deploy-net
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - deploy-net
    profiles:
      - monitoring

networks:
  deploy-net:
    driver: bridge
